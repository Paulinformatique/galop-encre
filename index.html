<title>Galop d'encre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="author" content="Paul Guibert">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: une plaque de film 16:9 au centre, une fine bande de commandes dessous */
:root{
  --bg:#141413; --plate:#f2f1ec; --ink:#121212; --muted:#8f8c83; --line:#2e2d2a; --chip:#1f1e1c;
  --display:'Rye',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--plate); font-family:var(--mono); margin:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px; box-sizing:border-box;
}
.plate{width:100%; max-width:960px; aspect-ratio:16/9; background:var(--plate); border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px var(--line)}
canvas{width:100%; height:100%; display:block}
.bar{width:100%; max-width:960px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.group{display:flex; flex-wrap:wrap; gap:6px}
button{
  font:500 12px/1 var(--mono); letter-spacing:.04em; color:var(--plate); background:var(--chip);
  border:1px solid var(--line); border-radius:3px; padding:9px 12px; cursor:pointer;
}
button[aria-pressed="true"]{background:var(--plate); color:var(--ink); border-color:var(--plate)}
button:focus-visible{outline:2px solid var(--plate); outline-offset:2px}
.meta{display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.count{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; letter-spacing:.04em}
.credit{font-family:var(--display); font-size:15px; color:var(--plate); letter-spacing:.03em}
</style>

<div class="plate"><canvas id="c" aria-label="Animation au trait de Paul Guibert : course de chevaux à travers l'Ouest"></canvas></div>
<div class="bar">
  <div class="group">
    <button id="play" aria-pressed="false">Pause</button>
    <button class="rate" data-fps="24" aria-pressed="true">Lisse · 24/s</button>
    <button class="rate" data-fps="12" aria-pressed="false">En 2 · 12 poses/s</button>
    <button class="rate" data-fps="8" aria-pressed="false">En 3 · 8 poses/s</button>
  </div>
  <div class="meta">
    <div class="credit">Réalisé par Paul Guibert</div>
    <div class="count" id="count">pose 0000</div>
  </div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=960, H=540, LOOP=40;
let INK='#121212', PAPER='#f2f1ec';
let fps=24, playing=true, t=0, last=null, lastStep=-1;
if (matchMedia('(prefers-reduced-motion: reduce)').matches){ playing=false; t=9.2; }

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
let rng=mulberry(1), J=1.2;
const wrap=(v,m)=>((v%m)+m)%m;

// ---------- primitives au trait (les points "bouillonnent" à chaque pose) ----------
function jit(pts){return pts.map(p=>[p[0]+(rng()-.5)*2*J, p[1]+(rng()-.5)*2*J])}
function trace(pts,close){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close)ctx.closePath()}
function poly(pts,close,fill){const q=jit(pts);trace(q,close);if(fill){ctx.fillStyle=PAPER;ctx.fill()}ctx.strokeStyle=INK;ctx.stroke()}
function ell(cx,cy,rx,ry,n=18){const a=[];for(let i=0;i<n;i++){const k=i/n*Math.PI*2;a.push([cx+Math.cos(k)*rx,cy+Math.sin(k)*ry])}return a}
function circle(cx,cy,r,fill){poly(ell(cx,cy,r,r,14),true,fill)}
// membre "tube" : trait épais encre puis trait papier par-dessus = contour seul
function limb(pts,w,lw){const q=jit(pts);ctx.lineCap='round';ctx.lineJoin='round';
  trace(q);ctx.strokeStyle=INK;ctx.lineWidth=w;ctx.stroke();
  trace(q);ctx.strokeStyle=PAPER;ctx.lineWidth=Math.max(0,w-2*lw);ctx.stroke();ctx.lineWidth=lw}

// ---------- cheval + cavalier (inventés) ----------
function horse(x,y,s,p,opt={}){
  const stand=opt.stand, air=opt.air;
  ctx.save();ctx.translate(x,y);ctx.scale(opt.flip?-s:s,s);
  const lw=2.3/s; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.lineCap='round'; J=1.25/s;
  const bob=stand?0:-4*Math.abs(Math.sin(p)); ctx.translate(0,bob);
  const legs=[[-32,-52,.5,false],[26,-50,2.3,true],[-38,-52,0,false],[32,-50,1.7,true]];
  const leg=([hx,hy,o,front])=>{
    let a1,a2;
    if(stand){a1=front?.03:.12;a2=front?0:-.12}
    else if(air){a1=front?-1.1:1.0;a2=front?.4:-.2}
    else{const sn=Math.sin(p+o),b=Math.max(0,Math.cos(p+o));a1=.1+.6*sn;a2=front?a1-1.25*b:a1+.8*b-.3}
    const kx=hx+Math.sin(a1)*25,ky=hy+Math.cos(a1)*24,fx=kx+Math.sin(a2)*27,fy=ky+Math.cos(a2)*27;
    limb([[hx,hy],[kx,ky],[fx,fy]],9,lw);
    poly([[fx-4,fy+1],[fx+4,fy+1]]);
  };
  const w=stand?Math.sin(p*.3)*2:Math.sin(p*2)*4;
  limb([[-44,-70],[-62,-70+w],[-80,-60-w],[-90,-46+w]],7,lw);       // queue
  leg(legs[0]);leg(legs[1]);
  const hd=opt.graze?62:0;                                           // tête baissée (campement)
  poly([[30,-74],[50,-108+hd*1.2],[64,-104+hd*1.2],[46,-56]],true,true);          // encolure
  poly(ell(0,-62,47,19,22),true,true);                                             // corps
  poly([[50,-107],[58,-117],[84,-101],[89,-92],[82,-87],[61,-95]].map(q=>[q[0],q[1]+hd*1.2]),true,true); // tête
  poly([[57,-114+hd*1.2],[58,-124+hd*1.2],[63,-114+hd*1.2]],false);              // oreille
  circle(70,-102+hd*1.2,1.3,false);
  for(let i=0;i<4;i++){const m=stand?0:Math.sin(p*2+i)*3;poly([[52-i*5,-108+i*9+hd*(1.2-i*.3)],[40-i*5,-104+i*9+m+hd*(1.2-i*.3)]])} // crinière
  leg(legs[2]);leg(legs[3]);
  if(opt.rider!==false){
    const r=stand?0:Math.sin(p*2)*2;
    ctx.translate(0,r);
    limb([[0,-80],[11,-66],[5,-50]],8,lw);                            // jambe
    poly([[-7,-80],[7,-80],[22,-108],[9,-114]],true,true);            // buste
    const sc=stand?0:Math.sin(p*3)*4;
    poly([[11,-112],[-4,-116+sc],[-14,-110-sc],[-2,-108]],true,true); // foulard
    limb([[16,-108],[31,-95],[47,-93]],6.5,lw);                       // bras
    circle(20,-121,7,true);                                           // tête
    if(opt.cap){poly([[13,-126],[20,-134],[28,-126]],true,true);poly([[24,-126],[36,-124]])} // casquette
    else{poly([[14,-127],[16,-137],[27,-137],[29,-126]],true,true);poly([[7,-127],[36,-125]])} // chapeau
    poly([[47,-93],[56,-98]]);                                        // rênes
  }
  ctx.restore(); ctx.lineWidth=2.3; J=1.2;
}

// ---------- décor ----------
function cactus(x,y,h){ctx.lineWidth=2.2;
  poly([[x-6,y],[x-6,y-h],[x,y-h-6],[x+6,y-h],[x+6,y]],false,true);
  poly([[x-6,y-h*.45],[x-18,y-h*.45],[x-18,y-h*.8],[x-12,y-h*.82],[x-12,y-h*.55],[x-6,y-h*.55]],false,true);
  poly([[x+6,y-h*.6],[x+16,y-h*.6],[x+16,y-h*.9],[x+11,y-h*.92],[x+11,y-h*.7],[x+6,y-h*.7]],false,true)}
function mesa(x,y,w,h){ctx.lineWidth=2;poly([[x,y],[x+w*.18,y-h],[x+w*.8,y-h],[x+w,y]],false,true);
  poly([[x+w*.25,y-h*.6],[x+w*.6,y-h*.6]])}
function dust(x,y,n,sz){ctx.lineWidth=1.8;for(let i=0;i<n;i++){circle(x-rng()*sz*3,y-rng()*sz,sz*(.3+rng()*.6),true)}}
function ground(y,offset,speed){ctx.lineWidth=2;poly([[-10,y],[W+10,y]]);
  for(let i=0;i<14;i++){const xx=wrap(i*97-offset*speed,W+120)-60;poly([[xx,y+14+(i%3)*14],[xx+30+(i%4)*10,y+14+(i%3)*14]])}}
function sun(x,y,r){ctx.lineWidth=2;circle(x,y,r,true);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;poly([[x+Math.cos(a)*(r+8),y+Math.sin(a)*(r+8)],[x+Math.cos(a)*(r+20),y+Math.sin(a)*(r+20)]])}}
function speedLines(T,n){ctx.lineWidth=2;for(let i=0;i<n;i++){const yy=40+((i*71)%460),xx=wrap(i*173-T*1400,W+300)-150;poly([[xx,yy],[xx+80+(i%5)*30,yy]])}}
function bird(x,y,s,f){ctx.lineWidth=2;const a=Math.sin(f)*10*s;poly([[x-30*s,y-a],[x-12*s,y-4*s],[x,y],[x+12*s,y-4*s],[x+30*s,y-a]]);poly([[x,y],[x+6*s,y+3*s]])}
function star(x,y,r){ctx.lineWidth=1.6;poly([[x-r,y],[x+r,y]]);poly([[x,y-r],[x,y+r]])}
function cloud(x,y,s){ctx.lineWidth=2;[[0,0,40],[40,-14,34],[78,0,38],[30,12,36]].forEach(([dx,dy,r])=>circle(x+dx*s,y+dy*s,r*s,true))}

// ---------- plans (40 s) ----------
const SHOTS=[
  [0,3,shotHooves],[3,8,shotStart],[8,12,shotDesert],[12,15.5,shotCanyon],
  [15.5,19.5,shotRiver],[19.5,23,shotJump],[23,27,shotDuel],[27,30.5,shotStorm],
  [30.5,34,shotCamp],[34,36.5,shotFinish],[36.5,40,shotTitle]
];

function shotHooves(T,k,p){
  const flip=T>=1.5;
  if(flip){ctx.save();ctx.translate(W,0);ctx.scale(-1,1)}
  speedLines(T,12);ground(H-24,T,900);
  horse(W*(flip?.42:.55),H-24,flip?4.2:5.6,p+(flip?1:0),{rider:false});
  dust(W*(flip?.25:.3),H-30,5,26);
  if(flip)ctx.restore();
}
function shotStart(T,k,p){
  const go=k>=2.6, g=go?k-2.6:0;
  ground(400,go?T:0,go?220:0);
  mesa(60,400,260,70);mesa(560,400,340,52);sun(820,90,30);
  ctx.lineWidth=2.4;poly([[120,400],[120,170]]);poly([[840,400],[840,170]]);poly([[120,180],[480,205],[840,180]]);
  for(let i=0;i<12;i++){const x0=150+i*58,y0=182+Math.sin(i/11*Math.PI)*22;poly([[x0,y0],[x0+12,y0+22],[x0+24,y0+1]],true,true)}
  const fx=880,fy=400; poly([[fx,fy],[fx-4,fy-52]]);circle(fx-5,fy-60,8,true);
  if(!go){poly([[fx-6,fy-44],[fx-26,fy-92]]);poly([[fx-26,fy-92],[fx-62,fy-102],[fx-56,fy-80],[fx-22,fy-78]],true,true)}
  else{poly([[fx-6,fy-44],[fx-36,fy-24]]);poly([[fx-36,fy-24],[fx-66,fy-6],[fx-52,fy+8],[fx-30,fy-8]],true,true)}
  const row=[[310,382,.78],[480,392,.86],[150,402,.94],[390,416,1.04],[220,432,1.14],[570,446,1.24],[70,462,1.34]];
  row.forEach(([x,y,s],i)=>{const xx=x+g*(260+i*22)*s;horse(xx,y,s,p+i*1.3,{stand:!go,cap:i%3===1});if(go)dust(xx-40*s,y-4,3,10*s)});
}
function shotDesert(T,k,p){
  sun(810,95,34);
  for(let i=0;i<4;i++){const xx=wrap(i*330-k*40,1320)-200;mesa(xx,300,240+i*30,50+(i%2)*30)}
  ctx.lineWidth=2;poly([[-10,300],[W+10,300]]);
  ground(430,k,700);
  for(let i=0;i<3;i++){const xx=wrap(i*420-k*700,1260)-150;cactus(xx,330+i*14,60+i*14)}
  horse(W*.46,430,1.75,p);dust(W*.3,425,6,16);
  for(let i=0;i<2;i++){const xx=wrap(i*630+300-k*1100,1260)-150;cactus(xx,520,120)}
}
function shotCanyon(T,k,p){
  // un aigle plane, la caméra descend sur trois cavaliers au fond du canyon
  const cam=Math.min(1,k/1.6)*60;
  ctx.save();ctx.translate(0,-cam);
  bird(300+k*120,130,1.4,T*6);bird(520+k*90,90,.8,T*6+1);
  ctx.lineWidth=2.4;
  poly([[-10,600],[-10,60],[90,70],[130,180],[210,200],[240,330],[300,360],[320,600]],true,true);
  poly([[W+10,600],[W+10,40],[860,60],[830,170],[760,190],[740,320],[680,350],[660,600]],true,true);
  for(let i=0;i<6;i++){poly([[20+i*30,140+i*40],[70+i*30,138+i*40]]);poly([[W-30-i*28,120+i*44],[W-80-i*28,118+i*44]])}
  ctx.lineWidth=2;poly([[320,500],[660,500]]);
  for(let i=0;i<3;i++){const xx=wrap(260+i*120+k*160,520)+250;horse(xx,500-i*6,.62-i*.08,p+i*2)}
  ctx.restore();
}
function shotRiver(T,k,p){
  // traversée de rivière : le cheval a de l'eau jusqu'au poitrail
  mesa(40,300,300,60);mesa(620,300,320,40);ctx.lineWidth=2;poly([[-10,300],[W+10,300]]);
  for(let i=0;i<3;i++){const xx=wrap(i*360-k*90,1080)-60;ctx.lineWidth=1.6;poly([[xx,330],[xx+60,330]])}
  const x=W*.46+Math.sin(k*1.4)*30;
  horse(x,500,1.7,p*.75);
  ctx.fillStyle=PAPER;ctx.fillRect(-20,440,W+40,140);
  for(let r=0;r<5;r++){const yy=440+r*20,ph=T*5+r;const pts=[];for(let xx=-20;xx<=W+20;xx+=24)pts.push([xx,yy+Math.sin(xx/40+ph)*4]);ctx.lineWidth=r?1.6:2.4;poly(pts)}
  ctx.lineWidth=1.8;for(let i=0;i<10;i++){const a=-Math.PI*(.15+rng()*.7),d=40+rng()*70;const sx=x+40+(rng()-.5)*120,sy=440;poly([[sx,sy],[sx+Math.cos(a)*d*.3,sy+Math.sin(a)*d*.6]]);circle(sx+Math.cos(a)*d*.4,sy+Math.sin(a)*d*.75,3,true)}
}
function shotJump(T,k,p){
  const u=k/3.5, x=-120+u*(W+260), gx=W*.5;
  ground(440,0,0);
  mesa(620,300,300,60);ctx.lineWidth=2;poly([[-10,300],[W+10,300]]);
  cloud(140,110,.9);
  ctx.lineWidth=2.4;poly([[gx-70,440],[gx-55,395],[gx-10,382],[gx+40,390],[gx+70,440]],false,true);poly([[gx-30,410],[gx,402]]);
  const d=(x-gx)/220, inAir=Math.abs(d)<1, y=440-(inAir?(1-d*d)*120:0);
  horse(x,y,1.6,p,{air:inAir});
  if(!inAir)dust(x-60,436,4,14);
}
function shotDuel(T,k,p){
  // deux cavaliers au coude à coude, l'un double l'autre
  speedLines(T,8);
  for(let i=0;i<3;i++){const xx=wrap(i*400-k*120,1200)-200;mesa(xx,280,260,40+i*10)}
  ctx.lineWidth=2;poly([[-10,280],[W+10,280]]);
  ground(470,k,900);
  const lead=Math.tanh((k-2)*1.5);
  horse(W*.42-lead*70,400,1.25,p+1.7,{cap:true});
  dust(W*.42-lead*70-70,396,3,10);
  horse(W*.48+lead*90,470,1.65,p);
  dust(W*.48+lead*90-90,466,4,14);
}
function shotStorm(T,k,p){
  // orage : la pluie tombe, et à chaque éclair l'image s'inverse
  const flash=(k>1&&k<1.15)||(k>2.4&&k<2.5)||(k>2.62&&k<2.7);
  if(flash){INK='#f2f1ec';PAPER='#121212';ctx.fillStyle=PAPER;ctx.fillRect(-10,-10,W+20,H+20)}
  cloud(80,70,1.6);cloud(380,40,1.9);cloud(700,80,1.5);
  if(flash){ctx.lineWidth=3;poly([[560,120],[530,210],[565,215],[520,330],[600,190],[565,185],[590,120]],true,true)}
  ground(450,k,600);
  horse(W*.4,450,1.7,p);
  ctx.lineWidth=1.4;for(let i=0;i<70;i++){const xx=wrap(i*53+T*-160,W+80)-40,yy=wrap(i*97+T*900,H+60)-30;poly([[xx,yy],[xx-8,yy+26]])}
}
function shotCamp(T,k,p){
  // halte de nuit : feu de camp, étoiles, le cheval broute
  for(let i=0;i<26;i++){star((i*137)%W,20+(i*53)%220,2+(i%3))}
  ctx.lineWidth=2;{const m=[];for(let i=0;i<=16;i++){const a=Math.PI*(.35+1.3*i/16);m.push([820+Math.cos(a)*26,80+Math.sin(a)*26])}
  for(let i=16;i>=0;i--){const a=Math.PI*(.42+1.16*i/16);m.push([834+Math.cos(a)*21,75+Math.sin(a)*21])}
  poly(m,true,true)}  // croissant de lune
  poly([[-10,330],[180,300],[400,320],[620,290],[W+10,320]]);
  ground(430,0,0);
  horse(690,430,1.25,T*2,{stand:true,rider:false,graze:true,flip:true});
  // feu
  const fx=420,fy=430;ctx.lineWidth=2.4;
  poly([[fx-40,fy],[fx+40,fy-14]]);poly([[fx-38,fy-14],[fx+42,fy]]);
  const flame=(cx,w,h,ph)=>{const pts=[];for(let i=0;i<=14;i++){const a=i/14*Math.PI*2,r=Math.sin(a/2);
      pts.push([cx+Math.sin(a)*w*(1-.6*Math.max(0,-Math.cos(a))),fy-8-(1-Math.cos(a))/2*h+Math.sin(T*9+ph+i)*2])}poly(pts,true,true)};
  flame(fx,30,78+Math.sin(T*11)*10,0);flame(fx-12,16,44+Math.sin(T*13+1)*8,2);flame(fx+13,14,40+Math.sin(T*12+2)*8,4);
  for(let i=0;i<5;i++){const y=fy-90-wrap(T*60+i*30,150);star(fx+Math.sin(y/20+i)*20,y,2)}
  // cavalier assis
  ctx.lineWidth=2.3;
  limb([[280,425],[312,410],[330,428]],8,2.3);
  poly([[268,428],[284,428],[300,384],[284,380]],true,true);
  limb([[294,392],[318,402],[340,398]],6.5,2.3);
  circle(296,368,9,true);poly([[287,361],[290,349],[304,349],[307,360]],true,true);poly([[280,361],[314,362]]);
}
function shotFinish(T,k,p){
  // ligne d'arrivée et foule (silhouettes simples)
  ground(450,k,500);
  ctx.lineWidth=2.4;poly([[700,450],[700,170]]);poly([[900,450],[900,170]]);
  poly([[690,170],[910,170],[910,230],[690,230]],true,true);
  ctx.font="34px Rye, Georgia, serif";ctx.textAlign='center';ctx.lineWidth=1.6;ctx.strokeStyle=INK;
  ctx.strokeText("ARRIVÉE",800+(rng()-.5)*2,214+(rng()-.5)*2);
  for(let i=0;i<14;i++){const xx=30+i*48,yy=330+(i%2)*14-Math.max(0,Math.sin(T*10+i))*8;
    poly([[xx-12,yy],[xx-8,yy-24],[xx+8,yy-24],[xx+12,yy]],true,true);circle(xx,yy-33,9,true);
    if(i%3===0)poly([[xx+6,yy-22],[xx+16,yy-52]])}
  const x=-150+k/2.5*(W+300);
  horse(x,450,1.8,p);dust(x-90,446,5,16);
}
function shotTitle(T,k,p){
  ctx.lineWidth=2.4;poly([[40,40],[W-40,40],[W-40,H-40],[40,H-40]],true);
  poly([[54,54],[W-54,54],[W-54,H-54],[54,H-54]],true);
  ctx.font="64px Rye, Georgia, serif";ctx.textAlign='center';ctx.lineWidth=2;ctx.strokeStyle=INK;
  const jx=(rng()-.5)*3,jy=(rng()-.5)*3;
  ctx.strokeText("GALOP D'ENCRE",W/2+jx,190+jy);
  ctx.font="30px Rye, Georgia, serif";ctx.lineWidth=1.4;
  ctx.strokeText("un film de Paul Guibert",W/2+jx*.6,248+jy*.6);
  ctx.font="500 14px 'IBM Plex Mono', monospace";ctx.fillStyle=INK;
  ctx.fillText(`${fps>=24?'animation lisse':'une pose tenue '+(24/fps)+' images'} · ${fps} poses par seconde`,W/2,288);
  ctx.save();ctx.beginPath();ctx.rect(58,58,W-116,H-116);ctx.clip();
  ground(440,k,500);
  horse(W/2-40,440,1.05,p);
  ctx.restore();
}

function draw(){
  const step=Math.floor(t*fps), T=(step/fps)%LOOP;
  rng=mulberry(step*7919+3);
  INK='#121212';PAPER='#f2f1ec';
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  ctx.translate((rng()-.5)*3,(rng()-.5)*3); // flottement de l'image
  ctx.strokeStyle=INK;ctx.lineWidth=2.3;ctx.lineJoin='round';ctx.lineCap='round';
  const s=SHOTS.find(x=>T>=x[0]&&T<x[1])||SHOTS[0];
  s[2](T,T-s[0],T*15);
  document.getElementById('count').textContent=`pose ${String(step%(LOOP*fps)).padStart(4,'0')} · ${T.toFixed(2)} s / ${LOOP} s`;
}

function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));draw()}
function loop(now){
  if(last!==null&&playing)t+=Math.min(.1,(now-last)/1000);
  last=now;
  const step=Math.floor(t*fps);
  if(step!==lastStep){lastStep=step;draw()}
  requestAnimationFrame(loop);
}
const playBtn=document.getElementById('play');
function syncPlay(){playBtn.textContent=playing?'Pause':'Lecture';playBtn.setAttribute('aria-pressed',String(!playing))}
playBtn.onclick=()=>{playing=!playing;syncPlay()};
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{
  fps=+b.dataset.fps;lastStep=-1;
  document.querySelectorAll('.rate').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});
addEventListener('resize',resize);
syncPlay();
(document.fonts?document.fonts.ready:Promise.resolve()).then(resize);
resize();requestAnimationFrame(loop);
</script>
